# Branch-based Pages serves index.html directly. It loads the light design explicitly.
# Do not turn internal review documents into public website pages.
exclude:
  - docs
  - tests
  - README.md
  - package.json
  - package-lock.json
  - build.mjs
  - serve.mjs
  - dist
  - node_modules
  - .github
  - motion.js
  - motion.css
  - journey.js
  - journey.css
