name: Verify light homepage and published site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-homepage
  cancel-in-progress: true
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate and build
        run: npm run check && npm run build
      - name: Install browser test tooling (no runtime dependency)
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify built website
        run: |
          node serve.mjs > "$RUNNER_TEMP/phoenix-server.log" 2>&1 &
          curl --retry 8 --retry-connrefused --retry-delay 1 --silent --fail http://127.0.0.1:4173 > /dev/null
          python tests/light_smoke.py --url http://127.0.0.1:4173 --output "$RUNNER_TEMP/phoenix-qa/local"
          python tests/redesign_smoke.py --url http://127.0.0.1:4173 --output "$RUNNER_TEMP/phoenix-qa/redesign"

      - name: Verify the actual published GitHub Pages website
        run: |
          python tests/light_smoke.py --url https://carnagerogue.github.io/phoenix-tech-refresh/ --wait-for-publish --output "$RUNNER_TEMP/phoenix-qa/published"

      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phoenix-light-browser-evidence
          path: ${{ runner.temp }}/phoenix-qa
          retention-days: 7
