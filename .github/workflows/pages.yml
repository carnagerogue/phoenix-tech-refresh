name: Publish executive preview (manual Actions source)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check JavaScript
        run: npm run check
      - name: Build the complete static homepage
        run: npm run build
      - name: Upload website only
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify Pages is enabled
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        # Enable Settings > Pages > Source: GitHub Actions once before deploying.
        # GITHUB_TOKEN cannot grant itself the administration permission for enablement.
      - name: Deploy executive preview
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
